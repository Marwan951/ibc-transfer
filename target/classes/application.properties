spring.application.name=securetransfer

# PostgreSQL - Local (pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/ibctransfer
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# SpringDoc/Swagger
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# JWT
app.jwt.secret=8f6b3e2a9d4c7f1e5b8a2d6e9c3f7a1b4e8d2c6f9b3a7e1d5c9f2b6a4e8d1c7
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200